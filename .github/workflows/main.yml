name: Build TWRP Recovery

on:
  workflow_dispatch:  # 手动触发编译

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3

      # 安装编译所需的所有依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y repo git gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc python3 libssl-dev brotli cpio schedtool

      # 下载 TWRP 12.1 源码 (对应 Android 13)
      - name: Download TWRP source
        run: |
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-12.1
          repo sync

      # 修正后的核心步骤：正确复制你的设备树文件
      - name: Copy device tree
        run: |
          mkdir -p device/meizu/m2391
          cp -r ./* device/meizu/m2391/

      # 开始编译
      - name: Build recovery
        run: |
          source build/envsetup.sh
          lunch omni_m2391-eng
          mka recoveryimage

      # 上传最终生成的 recovery.img 文件
      - name: Upload recovery image
        uses: actions/upload-artifact@v3
        with:
          name: TWRP_m2391
          path: out/target/product/m2391/recovery.img
